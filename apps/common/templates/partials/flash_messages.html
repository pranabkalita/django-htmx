{% if messages %}
<div class="js-toast-queue hidden" aria-hidden="true">
  {% for message in messages %}
  <div
    class="js-toast-item"
    data-toast-message="{{ message|escape }}"
    data-toast-tags="{{ message.tags|default:'' }}"
    data-toast-index="{{ forloop.counter0 }}"></div>
  {% endfor %}
</div>
{% endif %}
