<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
  <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-3 md:px-6">
    <a class="flex items-center gap-3" href="{% url 'pages:landing' %}" hx-get="{% url 'pages:landing' %}" hx-target="#content" hx-push-url="true">
      <div class="grid h-9 w-9 place-items-center rounded-lg bg-cyan-600 text-sm font-bold text-white">FA</div>
      <div>
        <p class="text-sm font-semibold leading-none text-slate-900">{{ app_name }}</p>
        <p class="text-xs text-slate-500">Secure identity platform</p>
      </div>
    </a>

    <div class="hidden items-center gap-1 md:flex">
      <a href="{% url 'pages:landing' %}" hx-get="{% url 'pages:landing' %}" hx-target="#content" hx-push-url="true"
         class="shell-nav-link {% if request.path == '/' %}shell-nav-link-active{% endif %}">Home</a>
      <a href="{% url 'pages:about' %}" hx-get="{% url 'pages:about' %}" hx-target="#content" hx-push-url="true"
        class="shell-nav-link {% if request.path == '/about/' %}shell-nav-link-active{% endif %}">About</a>
      <a href="{% url 'pages:contact' %}" hx-get="{% url 'pages:contact' %}" hx-target="#content" hx-push-url="true"
        class="shell-nav-link {% if request.path == '/contact/' %}shell-nav-link-active{% endif %}">Contact</a>
    </div>

    <div class="flex items-center gap-2">
      {% if request.user.is_authenticated %}
      <a href="{% url 'accounts:dashboard' %}" hx-get="{% url 'accounts:dashboard' %}" hx-target="#content" hx-push-url="true"
         class="btn-primary">Dashboard</a>
      {% else %}
      <a href="{% url 'accounts:login' %}" hx-get="{% url 'accounts:login' %}" hx-target="#content" hx-push-url="true"
         class="btn-secondary hidden sm:inline-flex">Sign In</a>
      <a href="{% url 'accounts:register' %}" hx-get="{% url 'accounts:register' %}" hx-target="#content" hx-push-url="true"
         class="btn-primary">Create Account</a>
      {% endif %}
    </div>
  </nav>
</header>
