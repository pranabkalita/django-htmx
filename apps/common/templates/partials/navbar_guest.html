<header class="border-b bg-white">
  <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
    <a class="font-semibold" href="{% url 'pages:landing' %}" hx-get="{% url 'pages:landing' %}" hx-target="#content" hx-push-url="true">SecureApp</a>
    <div class="space-x-4">
      <a href="{% url 'pages:landing' %}" hx-get="{% url 'pages:landing' %}" hx-target="#content" hx-push-url="true">Home</a>
      {% if request.user.is_authenticated %}
      <a href="{% url 'accounts:dashboard' %}" hx-get="{% url 'accounts:dashboard' %}" hx-target="#content" hx-push-url="true">Dashboard</a>
      {% else %}
      <a href="{% url 'accounts:login' %}" hx-get="{% url 'accounts:login' %}" hx-target="#content" hx-push-url="true">Login</a>
      <a href="{% url 'accounts:register' %}" hx-get="{% url 'accounts:register' %}" hx-target="#content" hx-push-url="true">Register</a>
      {% endif %}
      <a href="{% url 'pages:about' %}" hx-get="{% url 'pages:about' %}" hx-target="#content" hx-push-url="true">About</a>
      <a href="{% url 'pages:contact' %}" hx-get="{% url 'pages:contact' %}" hx-target="#content" hx-push-url="true">Contact</a>
    </div>
  </nav>
</header>
