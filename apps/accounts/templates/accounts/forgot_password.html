{% extends 'layouts/guest.html' %}
{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-65px)] w-full max-w-4xl items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-cyan-700">Recovery</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-900">Forgot Password</h1>
        <p class="mt-2 text-sm text-slate-500">Enter your email to receive a reset link.</p>
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}

            <div>
                <label for="{{ form.email.id_for_label }}"
                    class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
                <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}"
                    value="{{ form.email.value|default:'' }}" autocomplete="email" required
                    class="input-control{% if form.email.errors %} border-rose-400 focus:border-rose-400 focus:ring-rose-400{% endif %}">
                {% if form.email.errors %}<p class="mt-1 text-xs text-rose-600">{{ form.email.errors|striptags }}</p>{% endif %}
            </div>

            <button type="submit" class="btn-primary w-full py-2.5">
                Send Reset Link
            </button>
        </form>

        <div class="mt-4 text-sm">
            <a href="{% url 'accounts:login' %}" hx-get="{% url 'accounts:login' %}" hx-target="#content"
                hx-push-url="true"
                class="font-medium text-cyan-700 hover:text-cyan-800">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
