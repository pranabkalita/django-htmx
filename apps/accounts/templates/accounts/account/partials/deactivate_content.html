<div class="space-y-4">
  <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <p class="text-[11px] font-semibold uppercase tracking-[0.12em] text-emerald-600">Account Settings</p>
    <h1 class="mt-1 text-3xl font-bold leading-none text-slate-900">Profile &amp; Security</h1>
    <p class="mt-2 text-sm text-slate-500">Manage your identity information, credentials, and account protection from one place.</p>
  </section>

  <section class="grid grid-cols-1 gap-4 lg:grid-cols-12">
    <aside class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm lg:col-span-3">
      <nav class="space-y-1 text-sm">
        <a href="{% url 'accounts:profile' %}" hx-get="{% url 'accounts:profile' %}" hx-target="#content" hx-push-url="true" class="block rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Profile</a>
        <a href="{% url 'accounts:change_password' %}" hx-get="{% url 'accounts:change_password' %}" hx-target="#content" hx-push-url="true" class="block rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Change password</a>
        <a href="{% url 'accounts:twofa_settings' %}" hx-get="{% url 'accounts:twofa_settings' %}" hx-target="#content" hx-push-url="true" class="block rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">2FA</a>
        <a href="#" class="block rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Sessions</a>
        <a href="{% url 'accounts:deactivate_account' %}" hx-get="{% url 'accounts:deactivate_account' %}" hx-target="#content" hx-push-url="true" class="block rounded-lg bg-rose-50 px-3 py-2 font-medium text-rose-600">Deactivate account</a>
      </nav>
    </aside>

    <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm lg:col-span-9">
      <div class="mb-3 flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-semibold text-slate-900">Deactivate Account</h2>
          <p class="text-sm text-rose-600">This will disable your account access until reactivated by support.</p>
        </div>
        <span class="rounded-full bg-rose-50 px-2 py-1 text-[11px] font-semibold text-rose-600">Danger Zone</span>
      </div>

      <form method="post" class="space-y-3">
        {% csrf_token %}
        <div>
          <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Confirm password</label>
          <input type="password" name="password" placeholder="Enter your password to confirm" required
                 class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm outline-none focus:border-rose-400">
        </div>
        <div class="flex justify-end pt-1">
          <button type="submit" class="rounded-md bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">Deactivate Account</button>
        </div>
      </form>
    </div>
  </section>
</div>
