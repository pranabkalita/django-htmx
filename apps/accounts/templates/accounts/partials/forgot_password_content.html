<div class="flex min-h-[calc(100vh-65px)] items-center justify-center px-4 py-10">
	<div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

		<h1 class="text-2xl font-bold text-slate-900">Forgot Password</h1>
		<p class="mt-1 text-sm text-slate-500">Enter your email to receive a reset link.</p>

		{% include 'partials/flash_messages.html' %}

		<form method="post" class="mt-6 space-y-4">
			{% csrf_token %}

			<div>
				<label for="{{ form.email.id_for_label }}" class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
				<input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}"
							 value="{{ form.email.value|default:'' }}" autocomplete="email" required
							 class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500{% if form.email.errors %} border-rose-400{% endif %}">
				{% if form.email.errors %}<p class="mt-1 text-xs text-rose-600">{{ form.email.errors|striptags }}</p>{% endif %}
			</div>

			<button type="submit"
							class="w-full rounded-lg bg-emerald-600 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-500">
				Send Reset Link
			</button>
		</form>

		<div class="mt-4 text-sm">
			<a href="{% url 'accounts:login' %}" hx-get="{% url 'accounts:login' %}" hx-target="#content" hx-push-url="true"
				 class="font-medium text-emerald-600 hover:text-emerald-500">Back to login</a>
		</div>

	</div>
</div>
