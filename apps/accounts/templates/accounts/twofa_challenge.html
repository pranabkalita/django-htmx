{% extends 'layouts/guest.html' %}
{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-65px)] w-full max-w-4xl items-center justify-center px-4 py-10">
	<div class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
		<p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-cyan-700">Step-Up Verification</p>
		<h1 class="mt-2 text-3xl font-bold text-slate-900">2FA Challenge</h1>
		<p class="mt-2 text-sm text-slate-500">Enter your authenticator code to complete sign-in.</p>

		<form method="post" class="mt-6 space-y-4">
			{% csrf_token %}
			<div>
				<label for="id_otp_code" class="mb-1.5 block text-sm font-medium text-slate-700">Authenticator code</label>
				<input type="text" name="otp_code" id="id_otp_code" maxlength="6" placeholder="123456" autocomplete="one-time-code" required
						 class="input-control">
			</div>
			<button type="submit" class="btn-primary w-full py-2.5">
				Verify and Continue
			</button>
		</form>

		<p class="mt-4 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-center text-xs text-slate-500">If this challenge keeps failing, restart login and try a fresh OTP.</p>
	</div>
</div>
{% endblock %}
