{% extends 'layouts/guest.html' %}
{% block content %}
<div class="flex min-h-[calc(100vh-65px)] items-center justify-center px-4 py-10">
	<div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
		<h1 class="text-2xl font-bold text-slate-900">2FA Challenge</h1>
		<p class="mt-1 text-sm text-slate-500">Enter your authenticator code to complete sign-in.</p>

		<form method="post" class="mt-6 space-y-4">
			{% csrf_token %}
			<div>
				<label for="id_otp_code" class="mb-1.5 block text-sm font-medium text-slate-700">Authenticator code</label>
				<input type="text" name="otp_code" id="id_otp_code" maxlength="6" placeholder="123456" autocomplete="one-time-code" required
						 class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
			</div>
			<button type="submit" class="w-full rounded-lg bg-emerald-600 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-500">
				Verify and Continue
			</button>
		</form>

		<p class="mt-4 text-center text-xs text-slate-500">If this challenge keeps failing, restart login and try a fresh OTP.</p>
	</div>
</div>
{% endblock %}
